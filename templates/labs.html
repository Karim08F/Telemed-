<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container py-5">
        <div class="d-flex justify-content-between mb-4">
            <h3>🧬 Lab Results</h3>
            <a href="/patient" class="btn btn-outline-secondary">Back to Dashboard</a>
        </div>

        <div class="card p-4">
            {% if labs %}
            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Test Name</th>
                            <th>Value</th>
                            <th>Range</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for lab in labs %}
                        <tr>
                            <td>{{ lab.date }}</td>
                            <td>{{ lab.test_name }}</td>
                            <td class="fw-bold">{{ lab.value }} {{ lab.unit }}</td>
                            <td>{{ lab.reference_range }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            {% else %}
            <div class="text-center py-5">
                <p class="text-muted">No lab results found yet.</p>
                <small>Check back after your next clinic visit.</small>
            </div>
            {% endif %}
        </div>
    </div>
</body>

</html>
