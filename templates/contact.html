<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Care Team</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container py-5">
        <div class="d-flex justify-content-between mb-4">
            <h3>📞 Contact Care Team</h3>
            <a href="/patient" class="btn btn-outline-secondary">Back to Dashboard</a>
        </div>

        <div class="row">
            {% for doc in doctors %}
            <div class="col-md-6 mb-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title text-primary">Dr. {{ doc.name }}</h5>
                        <h6 class="card-subtitle mb-2 text-muted">{{ doc.specialization }}</h6>
                        <hr>
                        <p><strong>Email:</strong> {{ doc.email }}</p>
                        <p><strong>Phone:</strong> {{ doc.phone or 'N/A' }}</p>

                        <a href="mailto:{{ doc.email }}" class="btn btn-primary btn-sm w-100 mt-2">Send Email</a>
                    </div>
                </div>
            </div>
            {% else %}
            <p>No contact information available.</p>
            {% endfor %}
        </div>
    </div>
</body>

</html>
